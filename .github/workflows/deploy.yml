name: Deploy to Namecheap

# Builds the static site (Node runs here, not on the shared host — cPanel
# hosting doesn't reliably have a usable Node/npm setup for this) and
# uploads dist/ to public_html/geoquiz via FTPS. Needs three repo secrets:
# FTP_SERVER, FTP_USERNAME, FTP_PASSWORD — see "Deployment" in DESIGN.md.
#
# Runs on every push to main (except docs-only pushes), or by hand from the
# Actions tab / `gh workflow run "Deploy to Namecheap"` (scripts/deploy.sh).

on:
  push:
    branches: [main]
    # Docs-only pushes (README/DESIGN/LOG/MISTAKES) don't change the build.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Never run two uploads to the same folder at once; a newer push waits for
# the running deploy instead of cancelling it mid-upload.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to public_html/geoquiz via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # No dangerous-clean-slate: it wiped and re-uploaded the whole app on
          # every run (the app is half-missing while that happens). The
          # .ftp-deploy-sync-state.json on the server already lets the action
          # delete files it uploaded before, so stale hashed assets still
          # get cleaned up.
          # The FTP account's own login root is already public_html/geoquiz
          # (see cPanel's FTP Accounts "Path" column) — server-dir is
          # relative to that root, not the account's home directory, so
          # this must be "/", not "/public_html/geoquiz/" (which would
          # nest a duplicate public_html/geoquiz inside itself).
          server-dir: ./
